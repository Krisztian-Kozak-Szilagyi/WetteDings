# Tests für Pull Requests (nach test und main) und für jeden Push auf den Test-Branch: vor dem Zusammenführen
# ist sichtbar, ob die Tests grün sind. (Auf main laufen die Tests im Deployment, siehe deploy.yml.)
# Ablauf: Feature-Branches -> test (lokal ausprobieren) -> main (geht automatisch live).
name: Tests

on:
  push:
    branches: [test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
